<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><meta content="Interactive Formula 1 rankings" name="description"/><link href="./favicon.svg" rel="icon"/><title>Apex LineUp</title><link href="./styles.css?v=25" rel="stylesheet"/><link href="./workspace.css?v=6" rel="stylesheet"/><link href="./race-track.css?v=8" rel="stylesheet"/></head><body>
<main class="studio" id="lineup">
<div class="workspace-toolbar"><img alt="Apex LineUp" class="studio-mark" height="36" src="./assets/studio/apex-mark.svg" title="Apex LineUp" width="36"/><button id="shape-toggle" class="view-cycle" type="button"></button><div class="canvas-actions"><div aria-label="Ranking setup" class="setup-cluster" data-i18n-aria="setupGroup" role="group"><input aria-label="Setup name" id="setup-name" maxlength="32" value=""/><button aria-controls="code-panel" aria-expanded="false" class="text-button" data-i18n="setupCode" id="code-toggle">Weight code</button><button aria-label="Add ranking setup" class="add-setup-button" id="save-scenario" data-i18n-aria="addRanking" data-i18n-title="addRankingHint" title="Add ranking setup"><svg aria-hidden="true" class="studio-icon" focusable="false" viewbox="0 0 24 24"><use href="./assets/studio/icons.svg#plus"></use></svg><span data-i18n="addRanking">Add ranking</span></button><button aria-label="Compare setups" class="icon-button" id="overview-toggle" title="Compare setups"><svg aria-hidden="true" class="studio-icon" focusable="false" viewbox="0 0 24 24"><use href="./assets/studio/icons.svg#expand"></use></svg></button></div><button class="icon-button" id="reset-weights" data-i18n-aria="reset" data-i18n-title="reset"><svg class="studio-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="./assets/studio/icons.svg#reset"></use></svg></button><select aria-label="Website language" data-i18n-aria="languageAria" id="language-select"><option selected="" value="en">English</option><option value="zh">简体中文</option><option value="ja">日本語</option><option value="fr">Français</option><option value="ko">한국어</option><option value="hi">हिन्दी</option></select></div></div>
<section class="single-view" id="single-view"><div id="metric-dock" class="metric-dock" hidden></div><div aria-label="Driver rankings" class="lineup-scroll" id="lineup-scroll" tabindex="0"><div aria-live="polite" class="lineup-table" id="lineup-table"></div></div><div class="pagination"><output id="page-status"></output></div></section>
<section class="canvas-view" hidden="" id="compare"><div class="comparison-rank-trace" id="comparison-rank-trace" hidden></div><div aria-label="Ranking comparison canvas" class="comparison-chart" id="comparison-chart" tabindex="0"></div><div class="canvas-zoom"><div class="zoom-tools" data-zoom-controls="compare"><button aria-label="缩小方案对比" data-i18n-aria="zoomOutCompare" data-zoom="out" type="button">−</button><output data-zoom-value="">100%</output><button aria-label="放大方案对比" data-i18n-aria="zoomInCompare" data-zoom="in" type="button">+</button><button aria-label="重置方案对比缩放" data-i18n="resetZoom" data-i18n-aria="resetZoomCompare" data-zoom="reset" type="button">重置</button><button aria-pressed="false" data-i18n="drag" data-pan-toggle="" type="button">拖动</button></div><button aria-label="Fit canvas" id="fit-canvas" title="Fit canvas"><svg aria-hidden="true" class="studio-icon" focusable="false" viewbox="0 0 24 24"><use href="./assets/studio/icons.svg#fit"></use></svg></button></div></section>
</main><nav aria-label="Ranking tools" class="tool-rail" data-i18n-aria="tuningTools"><button data-i18n-aria="filters" data-i18n-title="filters" id="filters-toggle" aria-controls="filters-panel" aria-expanded="false" title="Filters"><svg class="studio-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6 7v7l-4-2v-5Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><b hidden id="active-filter-count">0</b></button><button aria-controls="reverse-panel" aria-expanded="false" id="reverse-toggle" data-i18n-aria="inverseTitle" data-i18n-title="inverseTitle"><svg aria-hidden="true" class="studio-icon" viewbox="0 0 24 24"><path d="M5 6h14M5 12h9M5 18h4M17 10v10m-3-3 3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg></button></nav>
<aside class="filters-workbench" id="filters-panel" hidden aria-labelledby="filters-heading"><div class="workbench-head"><strong id="filters-heading" data-i18n="filters">Filters</strong><button id="filters-close" class="icon-button" aria-label="Close">×</button></div><div class="filters-body"><div class="canvas-controls"><div class="period-controls"><label class="search-box"><span>⌕</span><input data-i18n-placeholder="searchPlaceholder" id="driver-search" placeholder="搜索车手或车队" type="search"/></label></div></div>
<div class="period-popover" id="period-popover"><form class="year-range-filter" id="year-range-filter">
<span class="range-title" data-i18n="yearRange">Year range</span>
<label><span data-i18n="fromYear">From</span><select aria-label="From year" data-i18n-aria="fromYearAria" id="year-from"></select></label>
<span aria-hidden="true" class="range-dash">—</span>
<label><span data-i18n="toYear">To</span><select aria-label="To year" data-i18n-aria="toYearAria" id="year-to"></select></label>
<button data-i18n="applyRange" type="submit">Apply</button>
<button class="range-reset" data-i18n="allYears" id="reset-year-range" type="button">All years</button>
</form></div><div class="filter-drawer" id="filter-drawer">
<div class="filter-grid">
<label><span data-i18n="filterTeam">车队</span><select id="team-filter"></select></label>
<label><span data-i18n="filterCountry">国籍</span><select id="country-filter"></select></label>
<label><span data-i18n="filterEra">活跃年代</span><select id="era-filter"></select></label>
<label><span data-i18n="filterAchievement">成绩门槛</span><select id="achievement-filter"></select></label>
<label><span data-i18n="filterMinStarts">最少大奖赛发车</span><input id="min-starts-filter" inputmode="numeric" min="0" step="1" type="number" value="0"/></label>
</div>
<div class="filter-footer"><output aria-live="polite" id="filter-summary"></output><button class="text-button" data-i18n="clearFilters" id="reset-filters" type="button">清除筛选</button></div>
</div>
</div></aside>
<aside aria-labelledby="code-heading" class="code-popover" hidden="" id="code-panel" role="dialog"><div class="workbench-head"><strong data-i18n="shareTitle" id="code-heading">Weight code</strong><button aria-label="Close" class="icon-button" id="code-close">×</button></div><div class="settings-pane code-pane" id="code-pane"><div class="code-export"><div class="code-section-head"><label data-i18n="currentSetup" for="weight-code">Current setup</label><button class="button primary" data-i18n="copyCode" id="copy-code" type="button">复制权重码</button></div><textarea aria-label="当前权重码" data-i18n-aria="currentCode" id="weight-code" readonly="" rows="3" spellcheck="false"></textarea></div><div class="code-import"><label data-i18n="importSetup" for="weight-import">Import a setup</label><textarea data-i18n-placeholder="pasteCode" id="weight-import" placeholder="Paste a weight code" rows="3" spellcheck="false"></textarea><button class="button ghost" data-i18n="importApply" id="import-code" type="button">导入并应用</button></div><p id="code-message" role="status"></p></div><div class="settings-footer"><button class="text-button" data-i18n="shareSite" id="share-site">Share</button></div></aside><aside aria-labelledby="analysis-heading" class="reverse-workbench" hidden="" id="reverse-panel" role="dialog"><div class="workbench-head"><strong data-i18n="inverseTitle" id="analysis-heading">Weights from order</strong><button aria-label="Close" class="icon-button" id="reverse-close">×</button></div><div class="settings-pane" id="reverse-pane"><section id="inverse"><div class="inverse-grid">
<div class="panel inverse-input"><div class="panel-head"><div><span class="panel-index">01 / YOUR ORDER</span><h3 data-i18n="targetOrder">Choose drivers</h3></div></div>
<div class="inverse-body"><div class="inverse-picker"><label for="inverse-search" data-i18n="inverseDriver">Driver</label><div class="inverse-search-wrap"><input id="inverse-search" type="search" role="combobox" aria-autocomplete="list" aria-controls="inverse-suggestions" aria-expanded="false" autocomplete="off" data-i18n-placeholder="inverseSearch" data-i18n-aria="inverseSearch" placeholder="Search drivers" aria-label="Search drivers"><div id="inverse-suggestions" class="inverse-suggestions" role="listbox" hidden></div></div><select id="inverse-driver" data-i18n-aria="inverseSelect" aria-label="Select a driver"></select><button class="button ghost" id="inverse-add" type="button" data-i18n="inverseAdd">Add</button></div><ol aria-label="Choose drivers" class="inverse-list" data-i18n-aria="targetOrder" id="inverse-list"></ol><button class="button primary" id="inverse-solve" type="button" data-i18n="inverseSolve">Find weights</button></div>
</div>
<div class="panel inverse-output"><div class="panel-head"><div><span class="panel-index">02 / MATCHING WEIGHTS</span><h3 data-i18n="resultWeights">Suggested weights</h3></div></div><div aria-live="polite" class="inverse-body" id="inverse-result" role="status"></div></div>
</div></section></div></aside>
<div class="toast" id="toast" role="status"></div><div hidden="" id="metric-tooltip" role="tooltip"></div>
<script defer="" src="./i18n.js?v=31"></script><script defer="" src="./static-data.js?v=16"></script><script defer="" src="./inverse-ranking.js?v=12"></script><script defer="" src="./ranking-motion.js?v=2"></script><script defer="" src="./race-track.js?v=7"></script><script defer="" src="./app.js?v=39"></script></body></html>
